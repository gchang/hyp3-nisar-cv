[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar_cv"
description = "Coefficient of variation and crop area from NISAR GCOV time series."
readme = "README.md"
requires-python = ">=3.12"
# Dependencies are managed in environment.yml (gdal comes from conda-forge)
dependencies = []

dynamic = ["version"]

[project.scripts]
nisar_cv = "nisar_cv.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# used only when there is no git metadata (for example a source archive)
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
install_types = true
disable_error_code = ["import-untyped"]
